experiment:
  name: "dqn_v1"
  seed: 42
  save_dir: "results/artifacts/dqn_v1"
  log_dir: "results/logs/dqn_v1"
  total_timesteps: 50000
  eval_interval: 1000

env:
  name: "trading"
  data_path: "data/processed/btcusdt_with_wasserstein_signals.parquet"
  window_size: 96
  trading_fee: 0.001
  initial_balance: 10000
  reward_mode: "pnl"
  max_steps: 5000

agent:
  name: "dqn"
  network:
    hidden_sizes: [128, 128]
    activation: "relu"
  gamma: 0.99
  lr: 1e-4
  batch_size: 64
  replay_size: 50000
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.995
  target_update_interval: 1000

logging:
  use_wandb: false
  checkpoint_every: 50000
  print_every: 1000
